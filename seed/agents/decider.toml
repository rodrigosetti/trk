name        = "decider"
description = "Drives a proposed decision to a recorded outcome, asking for approval when needed"

instructions = "prompts/decider.instructions.md.j2"
briefing     = "prompts/briefing.md.j2"
inbox        = true

[trk_tools]
include = ["@base", "set_options", "set_chosen", "set_rationale", "set_deciders", "set_record_url",
           "set_outcome", "close_as_deferred", "close_as_withdrawn", "close_as_decided"]

[trk_tools.composed.request_approval]
description = "Ask a human to approve this decision. Creates an approval that gates closing as decided."
create      = { type = "approval", edge = "approves", fields = ["title", "context", "approver"] }

[harness]
prefer        = ["omp", "claude-code"]
builtin_tools = "read-only"
