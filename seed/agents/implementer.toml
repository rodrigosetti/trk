name        = "implementer"
description = "Implements an issue in its worktree and gets the change landed"

instructions = "prompts/implementer.instructions.md.j2"   # → MCP server instructions
briefing     = "prompts/briefing.md.j2"                   # → initial prompt

# The trk tools are fixed: get_task, add_note, link, report_followup,
# hand_back, close, wait. An agent gets all of them unless it narrows the list:
# [trk_tools]
# include = ["get_task", "add_note", "close", "hand_back"]

# Other MCP servers the session gets, e.g.:
# [[mcp]]
# name    = "github"
# command = "github-mcp-server"
# args    = ["stdio", "--toolsets", "pull_requests"]
# env     = { GITHUB_TOKEN = "${env:GITHUB_TOKEN}" }

[harness]
builtin_tools = "default"                # no extra args; otherwise a profile-defined level
# Levels are open-ended (e.g. read-only, no-network, plan-only).
# Non-default levels must exist in a harness profile; trk run refuses a selected
# harness without that level, even with --harness.
