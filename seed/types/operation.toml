# Operations may be irreversible: a rollback plan is optional.
[type]
name        = "operation"
description = "A change to a running system, with a rollback plan and an audit trail"
statuses    = [ { name = "open",      category = "open" },
                { name = "ready",     category = "active" },
                { name = "executing", category = "active" },
                { name = "closed",    category = "closed" } ]
resolutions = ["done", "rolled_back", "failed", "cancelled"]

[type.transitions]
open      = ["ready", "closed"]
ready     = ["executing", "closed"]
executing = ["closed"]

[type.tools]
executing = { name = "start_execution", description = "Record that execution has started. Requires who executes it and when." }

[fields]
change_kind   = { required_at_create = true }
target        = { required_at_create = true }
environment   = { required_at_create = true }
change        = { required_at_create = true }
rollback_plan = {}
executed_by   = {}
executed_at   = {}
evidence_url  = {}
agent         = {}

[[requires]]
entering = "executing"
fields   = ["executed_by", "executed_at"]

[[requires]]
entering        = "executing"
in_edges_closed = { kind = "approves", src_resolution = "approved" }

[[requires]]
entering = "closed"
fields   = ["outcome"]

[[requires]]
entering   = "closed"
resolution = "done"
fields     = ["evidence_url"]

[routing]
agent = "operator"
