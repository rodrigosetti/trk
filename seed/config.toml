# trk settings for this project: launcher templates, harness profiles and
# named views. `trk install` writes every setting here; nothing is implied.

[user]
# Your human actor is human:<email>. Without it, pass --as or set TRK_ACTOR.
{{EMAIL_LINE}}

[issues]
# New issue ids are <prefix>-<base32>, e.g. {{PREFIX}}-4kq. Branches and
# worktrees made by `trk run` are named after the id.
prefix = "{{PREFIX}}"

[claims]
# Lease for agent claims. The MCP server renews it while running. A stopped MCP
# connection stops renewal even if the terminal stays live; expiry is separate
# from terminal liveness and reap. Human claims have no lease.
agent_lease = "30m"

[check]
# How often `trk check` runs a waiting issue's check when the issue does not say.
interval = "5m"
# How long one check may run before it counts as a failure.
timeout  = "10m"
# Verify the merged tree before local landing; empty skips verification.
# Runs in the issue worktree: include dependency setup here if needed.
# Holds the check queue and must fit timeout; use a fast subset or raise timeout.
verify = ""
# Maximum failed-check wakes per session. 0 disables waking and always reopens.
max_wakes = 5
# Sweep closed, done issues after each full `trk check` pass.
gc = true
# Minimum time closed before cleanup. "0" removes immediately; --no-gc skips it.
gc_grace = "1h"

[run]
# Where `trk run` creates git worktrees: absolute, ~/…, or relative to the
# project root.
worktrees = ".trk/worktrees"
# Branch new issue branches start from and checks land on.
# Detected at install: origin/HEAD, then the primary checkout's branch, then main.
base = {{BASE}}
# Implementer landing recipe: prompts/_landing.<landing>.md.j2.
# Built-ins: "merge" (local checkout), "pr" (GitHub pull request).
landing = "merge"

# Launcher templates. Placeholders: {name} (terminal name), {cwd},
# {shell_command} (cd + env + harness argv), {text}.
[launcher]
start      = ["hc", "run", "--bg", "--no-parent", "--name", "{name}", "--cwd", "{cwd}", "--", "sh", "-c", "{shell_command}"]
# Open a new Herdr space named with the issue title, rooted in its worktree.
# If the UI is unavailable before launch, use start headlessly and warn.
herdr      = true
attach     = ["hc", "attach", "{name}"]
send       = ["hc", "send", "{name}", "{text}"]
# Optional terminal probe for non-Herdr launchers (Herdr uses has_terminal).
# Requires a known local claim host and nonblank terminal; {name} is substituted.
# Exit 0 = live, 1 = gone; other exits, command errors, missing/empty = unknown.
# Unknown sessions are not woken/resumed or reaped. Wakes also require send.
# Example for a tmux launcher: has-session exits 1 when the target is missing.
# alive = ["tmux", "has-session", "-t", "{name}"]
# Seconds to wait before sending the briefing to harnesses that take it by `send`.
send_delay = 5
# Total attempts for all sends (briefing, trk send, resume, check wakes/notifications).
# 0 means a single attempt.
send_retries = 10
# Seconds between failed send attempts; separate from the initial send_delay.
send_retry_delay = 3

# Harness profiles use MiniJinja in command, args, env values, file paths/content
# and optional args. Scalars: name issue actor agent harness model cwd worktree
# (falls back to cwd), session_dir briefing briefing_file instructions
# instructions_file mcp_json_file trk_command. Lists/maps: trk_args trk_env
# trk_tools mcp_servers (name/command/args/env, trk first).
# Filters: tojson (compact JSON), toml (inline TOML); map/join are available.
# Values are rendered once, never recursively. Legacy single-brace placeholders
# remain supported but deprecated, including {mcp_json}, {opencode_json},
# {trk_args_toml}, {trk_env_toml} and {trk_tools:PREFIX}.
# Standalone args elements {builtin_tools_args}, {model_args}, {agent_args}
# expand in place to zero or more argv entries (not deprecated placeholders).
# A group without a marker goes before the first briefing argument, or at the
# end if none; unmarked groups keep builtin/model/agent order. No shell splitting.
#   files                = files written before launch (relative to the worktree)
#   args_json            = template rendering a JSON string array prepended to args
#   model                = default model (agent or --model may override)
#   model_args           = extra args added only when a model is set
#   builtin_tools.<lvl>   = extra args enforcing any project-defined level
#   server_instructions  = false folds the MCP server instructions into the briefing
#   briefing             = "arg" | "send"
# Agent builtin_tools = "default" is reserved: no extra restriction args.
# Other levels (e.g. read-only, no-network, plan-only) must be defined by a profile.
# An empty list declares support without extra args. trk agent check lists unknown
# levels and warns for unsupported preferences; trk run refuses an unsupported
# selected profile, including explicit --harness selections.

[harness.omp]
command = "omp"
args    = ["--config", "{{ session_dir }}/omp.yml", "{builtin_tools_args}", "{model_args}", "{agent_args}", "{{ briefing }}"]
model   = "openai-codex/gpt-6-luna"
model_args = ["--model", "{{ model }}"]
# .omp/mcp.json goes in the worktree (added to .git/info/exclude). The overlay
# hides the `trk` skill: sessions reach trk through MCP only.
files   = { ".omp/mcp.json" = '''{"mcpServers":{{ '{' }}{% for server in mcp_servers %}{{ server.name | tojson }}:{"command":{{ server.command | tojson }},"args":{{ server.args | tojson }},"env":{{ server.env | tojson }}}{% if not loop.last %},{% endif %}{% endfor %}}}''', "{{ session_dir }}/omp.yml" = "skills:\n  ignoredSkills: [trk]\n" }
# omp hides MCP tools not named in --tools, so the trk tools are listed. omp
# keeps `write` available even then: read-only is not fully enforced.
builtin_tools = { read-only = ["--tools", "read,grep,glob,lsp,todo,{% for tool in trk_tools %}mcp__trk_{{ tool }}{% if not loop.last %},{% endif %}{% endfor %}"] }

[harness.claude-code]
command = "claude"
args    = ["--strict-mcp-config", "--mcp-config", "{{ mcp_json_file }}", "{builtin_tools_args}", "{model_args}", "{agent_args}", "{{ briefing }}"]
model_args = ["--model", "{{ model }}"]
builtin_tools = { read-only = ["--disallowedTools", "Edit,Write,Bash,NotebookEdit"], none = ["--tools", ""] }

[harness.codex]
command = "codex"
args_json = '''[
{% for server in mcp_servers %}
{% if not loop.first %},{% endif %}
{% for field in ["command", "args", "env"] %}
{% if not loop.first %},{% endif %}
"-c", {{ ("mcp_servers." ~ server.name ~ "." ~ field ~ "=" ~ (server[field] | toml)) | tojson }}
{% endfor %}
{% endfor %}
]'''
args    = ["{builtin_tools_args}", "{model_args}", "{agent_args}", "{{ briefing }}"]
model_args = ["--model", "{{ model }}"]
builtin_tools = { read-only = ["--sandbox", "read-only"] }

[harness.opencode]
command  = "opencode"
args     = ["{builtin_tools_args}", "{model_args}", "{agent_args}"]
model_args = ["--model", "{{ model }}"]
env      = { OPENCODE_CONFIG_CONTENT = '''{"$schema":"https://opencode.ai/config.json","mcp":{{ '{' }}{% for server in mcp_servers %}{{ server.name | tojson }}:{"type":"local","command":{{ ([server.command] + server.args) | tojson }},"environment":{{ server.env | tojson }},"enabled":true}{% if not loop.last %},{% endif %}{% endfor %}}}''' }
briefing = "send"

[harness.pi]
command = "pi"
model_args = ["--model", "{{ model }}"]
args    = ["{builtin_tools_args}", "{model_args}", "{agent_args}", "{{ briefing }}"]
env     = { PI_CODING_AGENT_DIR = "{{ session_dir }}" }
files   = { "{{ session_dir }}/mcp.json" = '''{"mcpServers":{{ '{' }}{% for server in mcp_servers %}{{ server.name | tojson }}:{"command":{{ server.command | tojson }},"args":{{ server.args | tojson }},"env":{{ server.env | tojson }}}{% if not loop.last %},{% endif %}{% endfor %}}}''' }

# Named views: `trk list @mine`.
[views.mine]
query = "claimed-by=me"

[views.agents]
query  = "claimed-by=agent:*"
fields = ["id", "state", "claimed-by", "lease", "title"]

[views.open]
query = "state!=closed"
sort  = "priority,-updated"

[views.waiting]
query  = "state=waiting"
fields = ["id", "priority", "waiting", "next-check", "title"]
sort   = "next-check"
