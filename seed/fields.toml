# Field definitions. `shared = true` fields exist on every issue; some use
# common issue columns and others are stored in issue.fields.
# Kinds: text markdown int bool date datetime url enum actor repo link list.

[title]
kind = "text"
shared = true
description = "One-line summary"

[context]
kind = "markdown"
shared = true
description = "Background, motivation, constraints"

[outcome]
kind = "markdown"
shared = true
description = "What happened, written when closing"

[owner]
kind = "actor"
shared = true
description = "Who is accountable (distinct from the claimant)"

[priority]
kind = "enum"
values = ["P0", "P1", "P2", "P3"]
shared = true
description = "Project-relative work ordering; P0 urgent through P3 low"

[links]
kind = "list"
item = "link"
shared = true
description = "Free-form evidence: {kind, url, note}"

[tags]
kind = "list"
item = "text"
shared = true

# --- per-type fields --------------------------------------------------------

[agent]
kind = "text"
description = "Agent to run on this issue instead of the type's default"

[repo]
kind = "repo"
description = "Repository the change lands in"

[branch]
kind = "text"
description = "Git branch holding the change"

[pr_url]
kind = "url"
description = "Pull request URL"

[merge_commit]
kind = "text"
description = "Commit the PR was merged as"

[question]
kind = "markdown"
description = "The question to answer or decide"

[doc_url]
kind = "url"
description = "Where the answer is written up"

[sources]
kind = "list"
item = "text"
description = "Sources consulted"

[confidence]
kind = "enum"
values = ["low", "medium", "high"]

[options]
kind = "list"
item = "text"
description = "Options considered"

[chosen]
kind = "text"
description = "The option chosen"

[rationale]
kind = "markdown"

[deciders]
kind = "list"
item = "actor"
description = "Who made the decision"

[record_url]
kind = "url"
description = "Where the decision or approval is recorded (e.g. a Slack thread)"

[revisit_by]
kind = "date"

[approver]
kind = "actor"
description = "Who must approve"

[conditions]
kind = "markdown"
description = "Conditions attached to the approval"

[expires_at]
kind = "datetime"

[change_kind]
kind = "enum"
values = ["deploy", "config", "migration", "flag", "infra", "data", "access", "other"]

[target]
kind = "text"
description = "What the operation changes (service, flag, table…)"

[environment]
kind = "enum"
values = ["dev", "staging", "prod"]

[change]
kind = "markdown"
description = "The exact change to make"

[rollback_plan]
kind = "markdown"

[executed_by]
kind = "actor"

[executed_at]
kind = "datetime"

[evidence_url]
kind = "url"
description = "Audit trail of the execution"

[target_date]
kind = "date"

[success_criteria]
kind = "markdown"
